<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open Midnight Paws Boba</title>
<style>body{min-height:90vh;display:grid;place-content:center;background:#211b29;color:#ffe8c4;font:18px system-ui,sans-serif;padding:18px}a{color:#a9dfc5}h1{font-size:28px}</style></head>
<body><main><h1>Midnight Paws Boba</h1><p id="status" role="status">Opening the boba counter…</p><a href="./index.html#cafe">Open my game</a></main>
<script>
(async()=>{
  const open=()=>location.replace('./index.html#cafe');
  if(!('serviceWorker' in navigator)){open();return;}
  try{
    const reg=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});
    if(navigator.onLine)await reg.update();
    const worker=reg.installing||reg.waiting||reg.active;
    if(worker&&worker.state!=='activated'){
      await new Promise((resolve,reject)=>{
        const check=()=>{if(worker.state==='activated')resolve();if(worker.state==='redundant')reject();};
        worker.addEventListener('statechange',check);check();
      });
    }
    open();
  }catch{
    if(!navigator.onLine){open();return;}
    document.getElementById('status').textContent='The update could not finish downloading. Refresh to retry, or open your saved game.';
  }
})();
</script></body></html>
